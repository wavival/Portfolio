[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  # PUBLIC_ vars are client-exposed by design (Astro convention), not secrets.
  # Their values legitimately appear in repo docs (.env.example, README) and the
  # built client bundle, so exclude them from Netlify's secrets scanner.
  SECRETS_SCAN_OMIT_KEYS = "PUBLIC_UMAMI_SRC,PUBLIC_UMAMI_ID,PUBLIC_GSV"

[[redirects]]
  from = "/api/*"
  to = "https://nullbreach-api.wavival.dev/api/:splat"
  status = 200

[[redirects]]
  from = "/nullbreach/*"
  to = "https://null-breach.netlify.app/:splat"
  status = 200
  force = false

# Legacy English-word ES routes renamed to Spanish slugs (content unchanged, still Spanish).
[[redirects]]
  from = "/projects/*"
  to = "/proyectos/:splat"
  status = 301
[[redirects]]
  from = "/projects"
  to = "/proyectos"
  status = 301
[[redirects]]
  from = "/services"
  to = "/servicios"
  status = 301
[[redirects]]
  from = "/about"
  to = "/sobre-mi"
  status = 301
[[redirects]]
  from = "/contact"
  to = "/contacto"
  status = 301
[[redirects]]
  from = "/uses"
  to = "/herramientas"
  status = 301

[[redirects]]
  from = "/en/*"
  to = "/en/404.html"
  status = 404

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    # Analytics: Umami Cloud (cloud.umami.is) allowed in script-src + connect-src.
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://cloud.umami.is https://assets.calendly.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://assets.calendly.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://*.calendly.com https://d3v0px0pttie1i.cloudfront.net; connect-src 'self' https://cloud.umami.is https://nullbreach-api.wavival.dev https://calendly.com; frame-src https://calendly.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests"

[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/brand/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/icons/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/cv_valentina_ramirez_*.pdf"
  [headers.values]
    Cache-Control = "public, max-age=86400"

